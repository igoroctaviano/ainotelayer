name: ainotelayer
description: >
  Adds an in-app notes layer to a built web app before it is deployed as a
  preview. Reviewers right-click the running preview to pin notes to the UI.
  In a pull-request workflow the notes are comments on that pull request: no
  database, readable without sign-in on a public repository, and agents answer
  with gh. Otherwise they stay in each reviewer's browser, or go to a Firebase
  Realtime Database when database-url is set.

inputs:
  dir:
    description: Build output directory to add the layer to (run this after the build, before the deploy)
    required: true
  database-url:
    description: >
      Firebase Realtime Database URL, for example https://<project>-default-rtdb.firebaseio.com.
      Leave empty to keep notes in each reviewer's browser.
    default: ''
  pr:
    description: >
      Pull request the notes are kept on. Set it when the workflow is not
      triggered by a pull request, for example a manually run one.
    default: ${{ github.event.pull_request.number }}
  branch:
    description: >
      Branch the build was made from, recorded with the notes. Worked out from
      the pull request when left empty.
    default: ''
  sha:
    description: >
      Commit the build was made from; notes link to source files at this
      commit. Worked out from the pull request when left empty.
    default: ''
  github-token:
    description: Token that can read the pull request, to work out its branch and commit
    default: ${{ github.token }}
  store:
    description: >
      Where notes are kept. `auto` uses the pull request when there is one
      (the workflow runs for it, or `pr` is set), else the browser. `github`
      and `browser` force either.
    default: auto
  app:
    description: App name shown with the notes
    default: ${{ github.event.repository.name }}
  key:
    description: What the notes belong to. Builds with the same key share their notes, so a PR keeps its notes across pushes.
    default: pr-${{ github.event.pull_request.number || github.ref_name }}
  salt:
    description: A secret that makes the review id unguessable. Anyone with the id can read and write the notes.
    default: ''
  base:
    description: URL path the app is served under
    default: /

outputs:
  review-id:
    description: The id the notes are stored under
    value: ${{ steps.inject.outputs.review-id }}
  notes-url:
    description: Public URL of all notes as JSON (empty without a database)
    value: ${{ steps.inject.outputs.notes-url }}
  agent-path:
    description: Path on the deployed preview of the page to hand to an agent
    value: ${{ steps.inject.outputs.agent-path }}

runs:
  using: composite
  steps:
    - id: inject
      shell: bash
      env:
        REVIEW_DIR: ${{ inputs.dir }}
        REVIEW_DB: ${{ inputs.database-url }}
        REVIEW_APP: ${{ inputs.app }}
        REVIEW_KEY: ${{ inputs.key }}
        REVIEW_SALT: ${{ inputs.salt }}
        REVIEW_BASE: ${{ inputs.base }}
        REVIEW_REPO: ${{ github.repository }}
        REVIEW_PR: ${{ inputs.pr }}
        REVIEW_STORE: ${{ inputs.store }}
        REVIEW_BRANCH: ${{ inputs.branch || github.head_ref }}
        REVIEW_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
        REVIEW_REF_NAME: ${{ github.ref_name }}
        REVIEW_RUN_SHA: ${{ github.sha }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # A run that was not started by the pull request (a manual one) only
        # knows its number: ask GitHub which branch and commit it is.
        if [ -n "$REVIEW_PR" ] && { [ -z "$REVIEW_BRANCH" ] || [ -z "$REVIEW_SHA" ]; }; then
          # Its outputs are not this step's, and a failed lookup must not fail the build.
          info="$(GITHUB_OUTPUT= node "$GITHUB_ACTION_PATH/pr-info.mjs" --pr "$REVIEW_PR" --allow-forks || true)"
          REVIEW_BRANCH="${REVIEW_BRANCH:-$(printf '%s\n' "$info" | sed -n 's/^ref=//p')}"
          REVIEW_SHA="${REVIEW_SHA:-$(printf '%s\n' "$info" | sed -n 's/^sha=//p')}"
        fi
        REVIEW_BRANCH="${REVIEW_BRANCH:-$REVIEW_REF_NAME}"
        REVIEW_SHA="${REVIEW_SHA:-$REVIEW_RUN_SHA}"
        store=()
        if [ "$REVIEW_STORE" != "browser" ] && [ -n "$REVIEW_PR" ]; then
          store=(--github "$REVIEW_REPO" --pr "$REVIEW_PR")
        elif [ "$REVIEW_STORE" = "github" ]; then
          echo "::error::store is github, but this workflow run has no pull request"
          exit 1
        fi
        node "$GITHUB_ACTION_PATH/inject.mjs" \
          "${store[@]}" \
          --dir "$REVIEW_DIR" \
          --db "$REVIEW_DB" \
          --app "$REVIEW_APP" \
          --key "$REVIEW_KEY" \
          --salt "$REVIEW_SALT" \
          --base "$REVIEW_BASE" \
          --repo "$REVIEW_REPO" \
          --branch "$REVIEW_BRANCH" \
          --sha "$REVIEW_SHA"
