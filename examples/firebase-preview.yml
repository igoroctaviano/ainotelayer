# Example: a PR preview on Firebase Hosting with ainotelayer on top.
# Copy into .github/workflows/ of the app's repo and adjust the build step.
#
# Needs, once per Firebase project:
#   - repo secret FIREBASE_SERVICE_ACCOUNT, for the hosting deploy
#   - to share notes between reviewers: a Realtime Database with
#     database.rules.json deployed, repo variable REVIEW_DATABASE_URL and repo
#     secret REVIEW_SALT. Without them notes stay in each reviewer's browser.
#
# For notes that name the source file and line, add the build plugin to the
# app's bundler config once (see vite.mjs or webpack.cjs); AINOTELAYER=1 below
# switches it on for this build only.
name: preview-with-ainotelayer

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  preview:
    # Forked PRs cannot read the secrets, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The app's own build; anything that ends in a static output directory.
      - run: npm ci && npm run build
        env:
          AINOTELAYER: 1

      # After the build, before the deploy.
      - id: review
        uses: igoroctaviano/ainotelayer@main
        with:
          dir: build
          database-url: ${{ vars.REVIEW_DATABASE_URL }}
          salt: ${{ secrets.REVIEW_SALT }}

      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: pr-${{ github.event.pull_request.number }}

      # One comment on the pull request with the notes overview and the links to
      # hand to people and agents, plus the ainotelayer/notes status.
      - uses: igoroctaviano/ainotelayer/summary@main
        with:
          preview-url: ${{ steps.deploy.outputs.details_url }}
