# Example: a PR preview on Firebase Hosting with ainotelayer on top.
# Copy into .github/workflows/ of the app's repo and adjust the build step.
#
# Needs, once per Firebase project:
#   - repo secret FIREBASE_SERVICE_ACCOUNT, for the hosting deploy
#   - to share notes between reviewers: a Realtime Database with
#     database.rules.json deployed, repo variable REVIEW_DATABASE_URL and repo
#     secret REVIEW_SALT. Without them notes stay in each reviewer's browser.
#
# For notes that name the source file and line, add the build plugin to the
# app's bundler config once (see vite.mjs or webpack.cjs); AINOTELAYER=1 below
# switches it on for this build only.
name: preview-with-ainotelayer

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    # Forked PRs cannot read the secrets, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The app's own build; anything that ends in a static output directory.
      - run: npm ci && npm run build
        env:
          AINOTELAYER: 1

      # After the build, before the deploy.
      - id: review
        uses: igoroctaviano/ainotelayer@main
        with:
          dir: build
          database-url: ${{ vars.REVIEW_DATABASE_URL }}
          salt: ${{ secrets.REVIEW_SALT }}

      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: pr-${{ github.event.pull_request.number }}

      # One comment per PR with the links to hand to people and to agents.
      - uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
          NOTES_URL: ${{ steps.review.outputs.notes-url }}
          AGENT_PATH: ${{ steps.review.outputs.agent-path }}
        with:
          script: |
            const marker = '<!-- ainotelayer -->'
            const preview = process.env.PREVIEW_URL.replace(/\/$/, '')
            const body = [
              marker,
              `**Preview with notes:** ${preview}`,
              'Right-click anything in the preview to pin a note to it.',
              '',
              `**For an agent:** ${preview}${process.env.AGENT_PATH}`,
              `**All notes (JSON):** ${process.env.NOTES_URL}`,
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            })
            const mine = comments.find((comment) => comment.body.includes(marker))
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
