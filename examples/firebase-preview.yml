# Example: a PR preview on Firebase Hosting with the review layer on top.
# Copy into .github/workflows/ of the app's repo and adjust the build step.
#
# Needs, once per Firebase project:
#   - a Realtime Database with database.rules.json deployed
#   - repo variable REVIEW_DATABASE_URL, repo secrets REVIEW_SALT and
#     FIREBASE_SERVICE_ACCOUNT
name: preview-with-review-layer

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    # Forked PRs cannot read the secrets, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The app's own build; anything that ends in a static output directory.
      - run: npm ci && npm run build

      # After the build, before the deploy.
      - id: review
        uses: OWNER/review-layer@v1
        with:
          dir: build
          database-url: ${{ vars.REVIEW_DATABASE_URL }}
          salt: ${{ secrets.REVIEW_SALT }}

      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: pr-${{ github.event.pull_request.number }}

      # One comment per PR with the links to hand to people and to agents.
      - uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
          NOTES_URL: ${{ steps.review.outputs.notes-url }}
          AGENT_PATH: ${{ steps.review.outputs.agent-path }}
        with:
          script: |
            const marker = '<!-- review-layer -->'
            const preview = process.env.PREVIEW_URL.replace(/\/$/, '')
            const body = [
              marker,
              `**Preview with notes:** ${preview}`,
              'Right-click anything in the preview to pin a note to it.',
              '',
              `**For an agent:** ${preview}${process.env.AGENT_PATH}`,
              `**All notes (JSON):** ${process.env.NOTES_URL}`,
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            })
            const mine = comments.find((comment) => comment.body.includes(marker))
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
